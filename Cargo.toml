[package]
name = "assemblr"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Compose and maintain opinionated, reusable software units"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6.0.0"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
semver = "1.0.28"
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = "1.0.154"
sha2 = { version = "0.10.9", default-features = false }
unicode-normalization = "0.1.26"

[dev-dependencies]
regex-lite = "0.1.9"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
