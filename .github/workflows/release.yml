# Alpha releases (docs/adr/0026). A release is prepared only by
# starting this workflow by hand: it validates, builds and packages the
# binaries, and creates a *draft* prerelease. The owner publishes the draft,
# which creates the tag at the validated commit. To save Actions minutes, pull
# requests do not run it: start it by hand on the PR branch to check packaging
# changes; outside main it stops before creating a release.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; must be v<version in Cargo.toml>, e.g. v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that started the run, so every job builds the same one.
          ref: ${{ github.sha }}
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  # The binaries link their dependencies statically, so each archive carries
  # their license notices (docs/adr/0042).
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install
      # Pinned, so the notices come from the same tool on every run.
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli
      # Fails on a license that .github/release/about.toml does not accept.
      - run: >-
          cargo about generate --locked --fail
          -c .github/release/about.toml .github/release/about.hbs
          -o THIRD-PARTY-LICENSES.txt
      # cargo-about falls back to a generic template, without the copyright
      # line, when it does not recognise a crate's license file.
      - name: Check that every license names its copyright holder
        run: |
          if grep -nE '<year>|<copyright holders>|<owner>' THIRD-PARTY-LICENSES.txt; then
            echo "::error::a license is a template without its copyright line; add a clarify entry to .github/release/about.toml"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  package:
    name: Package (${{ matrix.target }})
    needs: [validate, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: a static binary that runs on any x64 Linux, WSL2 included.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: assemblr
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: assemblr.exe
          # Apple Silicon only; Intel Macs build from source (docs/adr/0043).
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: assemblr
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that started the run, so every job builds the same one.
          ref: ${{ github.sha }}
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An existing tag would win over the commit the draft targets.
          if [ "${{ github.event_name }}" = workflow_dispatch ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ inputs.tag }}" > /dev/null 2>&1; then
            echo "::error::the tag ${{ inputs.tag }} already exists"
            exit 1
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match the package version v$version"
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          name: third-party-licenses
          path: licenses

      - name: Build
        env:
          ASSEMBLR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          NAME: assemblr-${{ steps.version.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$NAME/"
          cp LICENSE-MIT LICENSE-APACHE licenses/THIRD-PARTY-LICENSES.txt "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            archive="$NAME.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$NAME' -DestinationPath '$archive'"
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" "$NAME"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # Run the packaged binary from outside the checkout, as a user would.
      - name: Smoke test the archive
        env:
          ARCHIVE: ${{ github.workspace }}/dist/${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSEMBLR_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          dir=$(mktemp -d)
          cd "$dir"
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '$ARCHIVE' -DestinationPath ."
          else
            tar -xzf "$ARCHIVE"
          fi
          bin=$(echo "$PWD"/assemblr-*/${{ matrix.exe }})
          for file in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt; do
            test -s "$(dirname "$bin")/$file" || { echo "::error::the archive has no $file"; exit 1; }
          done
          out=$("$bin" --version)
          echo "$out"
          case "$out" in
            "assemblr $VERSION (${GITHUB_SHA:0:12})") ;;
            *) echo "::error::unexpected version output: $out"; exit 1 ;;
          esac
          "$bin" --help > /dev/null
          mkdir project && cd project
          "$bin" init
          test -f assemblr.jsonc

      # Install the archive with install.sh or install.ps1, as a user would,
      # from a local copy of the release instead of GitHub (docs/adr/0043).
      - name: Smoke test the install script
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ github.workspace }}/dist/${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release="$RUNNER_TEMP/releases/v$VERSION"
          mkdir -p "$release"
          cp "$ARCHIVE" "$release/"
          (cd "$release" && shasum -a 256 assemblr-* > SHA256SUMS)
          ASSEMBLR_DOWNLOAD_URL="file://$RUNNER_TEMP/releases" \
            ASSEMBLR_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh install.sh
          out=$("$RUNNER_TEMP/bin/assemblr" --version)
          case "$out" in
            "assemblr $VERSION (${GITHUB_SHA:0:12})") ;;
            *) echo "::error::install.sh installed an unexpected version: $out"; exit 1 ;;
          esac

      - name: Smoke test the install script
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ github.workspace }}/dist/${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releases = Join-Path $env:RUNNER_TEMP releases
          $release = New-Item -ItemType Directory (Join-Path $releases "v$env:VERSION") -Force
          Copy-Item $env:ARCHIVE $release
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          Set-Content (Join-Path $release SHA256SUMS) "$hash  $(Split-Path $env:ARCHIVE -Leaf)"
          $env:ASSEMBLR_DOWNLOAD_URL = ([Uri] $releases).AbsoluteUri
          $env:ASSEMBLR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP bin
          # Windows PowerShell, which `irm | iex` runs in by default.
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw install.ps1 | Invoke-Expression"
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          $out = & (Join-Path $env:ASSEMBLR_INSTALL_DIR assemblr.exe) --version
          if ($out -ne "assemblr $env:VERSION ($($env:GITHUB_SHA.Substring(0, 12)))") {
            throw "install.ps1 installed an unexpected version: $out"
          }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.archive }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Prepare the draft release
    # Only a manual run on the integration branch prepares a release.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          # Only the archives; the license notices are inside each one.
          pattern: assemblr-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum assemblr-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "Assemblr $TAG" \
            --notes "Alpha, built from commit $GITHUB_SHA. Install and upgrade: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/user/install.md"
          # The tag is created only when the draft is published, at the commit
          # stored here: the one this run built, however far main has moved.
          pinned=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          if [ "$pinned" != "$GITHUB_SHA" ]; then
            echo "::error::the draft targets $pinned, not the built commit $GITHUB_SHA"
            exit 1
          fi
