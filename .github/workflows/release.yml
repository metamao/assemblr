# Private alpha releases (docs/adr/0026). A release is prepared only by
# starting this workflow by hand: it validates, builds and packages the
# binaries, and creates a *draft* prerelease. The owner publishes the draft,
# which creates the tag at the validated commit. Pull requests that touch the
# packaging run the same build and packaging, without creating a release.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; must be v<version in Cargo.toml>, e.g. v0.1.0-alpha.1"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  package:
    name: Package (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: a static binary that runs on any x64 Linux, WSL2 included.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: assemblr
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: assemblr.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - name: Check the version
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match the package version v$version"
            exit 1
          fi

      - name: Build
        env:
          ASSEMBLR_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          NAME: assemblr-${{ steps.version.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            archive="$NAME.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$NAME' -DestinationPath '$archive'"
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" "$NAME"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # Run the packaged binary from outside the checkout, as a user would.
      - name: Smoke test the archive
        env:
          ARCHIVE: ${{ github.workspace }}/dist/${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSEMBLR_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          dir=$(mktemp -d)
          cd "$dir"
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '$ARCHIVE' -DestinationPath ."
          else
            tar -xzf "$ARCHIVE"
          fi
          bin=$(echo "$PWD"/assemblr-*/${{ matrix.exe }})
          out=$("$bin" --version)
          echo "$out"
          case "$out" in
            "assemblr $VERSION (${GITHUB_SHA:0:12})") ;;
            *) echo "::error::unexpected version output: $out"; exit 1 ;;
          esac
          "$bin" --help > /dev/null
          mkdir project && cd project
          "$bin" init
          test -f assemblr.jsonc

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.archive }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Prepare the draft release
    # Only a manual run on the integration branch prepares a release.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum assemblr-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "Assemblr $TAG" \
            --notes "Private alpha. Install and upgrade: see the README (Installation)."
