name: CI

# Pull requests run the Linux checks only. Windows, macOS, and the MSRV run
# after the merge to main, or by hand on any branch (workflow_dispatch).
# Changes that touch only documentation skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Without arguments, rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Formatting does not depend on the platform, so it runs once.
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets --all-features
      # The manual-validation sandbox (ADR 0028) finds the binary it built.
      - run: cargo sandbox --name ci -- assemblr registry list

  msrv:
    name: Minimum supported Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked --all-targets --all-features
