name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review at a time per PR: a new push cancels the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required by the Claude GitHub App token exchange
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned to a release commit because this action receives the Claude
      # OAuth token. Update it deliberately.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read AGENTS.md and the "Code review
            guidelines" in CLAUDE.md, and follow them. The PR branch is checked
            out in the working directory. Read the change with `gh pr diff` and
            open files only as needed. Only the tools allowed for this run are
            available; do not rely on skills or other tools.

            This PR may have been reviewed before. Read earlier summaries with
            `gh pr view --comments` and earlier inline comments with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate --jq 'map({path, line, body})'`.
            Run each command on its own, without pipes. Do not repeat findings
            that were already reported and still apply, and do not comment
            again on unchanged code. Focus on issues that are new or materially
            changed.

            Post each new finding on a changed line as an inline comment with
            `mcp__github_inline_comment__create_inline_comment`, passing
            `confirmed: true`. Then post exactly one top-level comment with
            `gh pr comment` that lists the new findings by severity, names any
            earlier findings that the latest changes resolved, and notes any
            that still apply without repeating them. If nothing significant is
            new, say so in one line. Only post GitHub comments;
            do not reply with review text.
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Glob,Grep"
