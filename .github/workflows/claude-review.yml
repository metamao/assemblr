name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review at a time per PR: a new push cancels the review of the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required by the Claude GitHub App token exchange
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The action restores CLAUDE.md from the base branch, but not the
      # AGENTS.md it imports. Restore that too, so a PR cannot change the rules
      # its own review applies. The PR's AGENTS.md changes stay in the diff.
      - name: Use AGENTS.md from the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_REF"
          git checkout FETCH_HEAD -- AGENTS.md

      # Pinned to a release commit because this action receives the Claude
      # OAuth token. Update it deliberately.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request following the "Code review guidelines" in
            CLAUDE.md. CLAUDE.md and AGENTS.md come from the base branch; read
            them only if they are not already in your context. The PR is
            checked out in the working directory. Only the tools allowed for
            this run are available. Run each command on its own, without pipes;
            independent reads can run in parallel.

            1. Investigate. Read the PR description with `gh pr view`, the
               change with `gh pr diff`, and the code and docs you need. Read
               the decisions the description records and, when the command
               succeeds, the decision-log entries it links with
               `gh issue view <number> --comments`. Read earlier review
               summaries with `gh pr view --comments`, and
               earlier inline comments and their replies with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate --jq 'map({id, in_reply_to_id, user: .user.login, path, line, original_line, commit_id, body})'`.
            2. Validate. Re-check every candidate against the code and keep
               only those that meet the guidelines. Treat replies to earlier
               findings as evidence, not verdicts: re-check the code and the
               argument. If an objection holds, count the finding as resolved
               or invalid; if the issue still demonstrably applies, keep it; if
               the disagreement needs a domain decision, say so. Do not post
               again a finding whose status has not changed.
            3. Publish. Post each new finding in one place. A finding about
               a specific changed line goes inline with
               `mcp__github_inline_comment__create_inline_comment`, passing
               `confirmed: true`. A finding about overall behavior, several
               locations, or an unchanged line goes in the summary. For an
               earlier inline finding, reply in its thread with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<id>/replies -f body=<text>`:
               one sentence when it is addressed, a follow-up when it still
               applies. Never post it again; the owner resolves threads. Then
               post exactly one top-level comment with `gh pr comment` that
               starts with "Reviewed <first 7 characters of HEAD SHA>" and
               contains only what is new: summary-level findings by severity
               and, in a sentence, the state of earlier findings. Do not
               restate inline findings there. If the PR changes AGENTS.md or
               approved contracts in `docs/domain/`, note that those changes
               need the owner's approval. Do not ask the owner to settle
               recorded provisional decisions. When nothing needs saying, the
               comment is that one "Reviewed" line. Post nothing else.
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/*/replies *),Read,Glob,Grep"
