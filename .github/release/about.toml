# cargo-about configuration for the third-party license notices that
# release.yml packages with every binary (docs/adr/0042).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
]
targets = ["x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Assemblr itself (publish = false) ships its own LICENSE files instead.
private = { ignore = true }

# windows-sys and windows-link ship their MIT text indented, which cargo-about
# does not recognise; without these entries it falls back to the generic MIT
# template and loses the Microsoft copyright line. The checksum pins the file:
# when the text changes, the entry no longer applies, and the placeholder
# check in release.yml fails the job.
[windows-sys.clarify]
license = "MIT OR Apache-2.0"
[[windows-sys.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[windows-link.clarify]
license = "MIT OR Apache-2.0"
[[windows-link.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"
